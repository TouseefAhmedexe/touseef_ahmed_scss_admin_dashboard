<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Admin dashboard for the internship training assignments, styled with SCSS.">
    <meta name="author" content="Touseef Ahmed">
    <link rel="stylesheet" href="/src/scss/main.scss">
    <title>Assignments Dashboard | Bloomrix Admin</title>
</head>

<body>
    <a class="skip-link" href="#main-content">Skip to main content</a>

    <div class="app">
        <input class="nav-toggle__input" type="checkbox" id="nav-toggle" name="nav_toggle">
        <label class="app__backdrop" for="nav-toggle"></label>
        <aside class="sidebar">
            <a class="sidebar__brand" href="#overview">Bloomrix Interns</a>

            <nav class="sidebar__nav">
                <p class="sidebar__heading">Menu</p>
                <ul class="sidebar__list">
                    <li><a class="sidebar__link sidebar__link--active" href="#overview">Overview</a></li>
                    <li><a class="sidebar__link" href="#assignments">Assignments</a></li>
                    <li><a class="sidebar__link" href="#states">Interface states</a></li>
                    <li><a class="sidebar__link" href="#new-assignment">New assignment</a></li>
                </ul>
            </nav>

            <p class="sidebar__note">All data is sample data.</p>
        </aside>
        <div class="app__main">
            <header class="topbar">
                <label class="nav-toggle__button" for="nav-toggle">Menu</label>
                <p class="topbar__title">Bloomrix Admin</p>

                <div class="topbar__actions">
                    <div class="theme-switch">
                        <input type="checkbox" id="theme-toggle" name="theme_toggle">
                        <label for="theme-toggle">Dark theme</label>
                    </div>

                    <p class="topbar__user"><span class="topbar__avatar">TA</span> Touseef Ahmed</p>
                </div>
            </header>

            <main class="content" id="main-content">

            </main>

            <footer class="footer">
                <p><small>&copy; 2026 Touseef Ahmed. A sample admin dashboard.</small></p>
            </footer>
        </div>

    </div>
</body>

</html>
